name: "Tag, Release"
on:
  push:
    branches:
      - main
    paths:
      - "composer.json"
  workflow_dispatch:

jobs:
  tag_and_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: ctype, json, mbstring, pdo
          coverage: none

      - name: Install dependencies & verify quality gate
        run: |
          composer install --no-interaction --prefer-dist
          composer analyse
          composer test

      - name: Configure Git User
        env:
          GIT_ACTOR: ${{ github.actor }}
        run: |
          git config user.name "${GIT_ACTOR}"
          git config user.email "${GIT_ACTOR}@users.noreply.github.com"

      - name: Extract version from composer.json
        id: get_version
        run: |
          VERSION=$(php -r "echo json_decode(file_get_contents('composer.json'))->version ?? '';")

          if [ -z "$VERSION" ]; then
            echo "::error::Could not find 'version' field in composer.json"
            exit 1
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid semantic version format in composer.json: $VERSION"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check_tag
        env:
          PKG_VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          TAG="v${PKG_VERSION}"
          if git ls-remote --exit-code --refs --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists on remote. Skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Git Tag and GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_VERSION: ${{ steps.get_version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          TAG="v${PKG_VERSION}"
          echo "Generated Tag: $TAG"
          git tag "$TAG"
          git push origin "$TAG"

          # Custom Release Notes Generator
          echo "## What's Changed" > release_notes.md
          echo "" >> release_notes.md

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log --format="%H" "${PREV_TAG}..HEAD")
            COMPARE_URL="https://github.com/$REPO/compare/$PREV_TAG...$TAG"
          else
            COMMITS=$(git log --format="%H" HEAD)
            COMPARE_URL="https://github.com/$REPO/commits/$TAG"
          fi

          for SHA in $COMMITS; do
             TITLE=$(git log --format="%s" -n 1 "$SHA")
             SHORT_SHA=$(git rev-parse --short "$SHA")
             LOGIN=$(gh api "repos/$REPO/commits/$SHA" --jq '.author.login // empty' 2>/dev/null || echo "")
             if [ -z "$LOGIN" ]; then
                LOGIN=$(git log --format="%an" -n 1 "$SHA")
             fi

             if [[ "$LOGIN" == *" "* ]]; then
               echo "* $TITLE by **$LOGIN** in $SHORT_SHA" >> release_notes.md
             else
               echo "* $TITLE by @$LOGIN in $SHORT_SHA" >> release_notes.md
             fi
          done

          echo "" >> release_notes.md
          echo "**Full Changelog**: $COMPARE_URL" >> release_notes.md

          gh release create "$TAG" -F release_notes.md --title "$TAG"
